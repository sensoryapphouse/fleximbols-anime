  <circle cx="236" cy="100" r="16" fill="#ffd7dc"/>

  <!-- Up-arrow: shaft from box top (y=270) down to arrowhead base, tip touches ball bottom (y=174) -->
  <!-- Shaft: x=244 y=210 w=24 h=60 — runs from y=210 to y=270 (box top) -->
  <rect x="244" y="210" width="24" height="60" fill="#22aa22" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Arrowhead tip at y=174 (ball bottom), base at y=214 -->
  <polygon points="256,174 230,214 282,214" fill="#22aa22" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Canonical OPEN BOX -->
  <!-- Interior back wall -->
