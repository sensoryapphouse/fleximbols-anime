  <!-- Ball drawn FIRST at cx=256 cy=290 — center of box interior -->
  <circle cx="256" cy="290" r="54" fill="#e63946" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="236" cy="270" r="16" fill="#ffd7dc"/>

  <!-- Canonical OPEN BOX drawn AFTER — front face (y=326-420) covers lower half of ball -->
  <!-- Interior back wall -->
  <rect x="140" y="270" width="232" height="44" fill="#3a2010" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Interior floor sloping forward -->
