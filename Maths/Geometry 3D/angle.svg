<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" data-copyright="© 2026 Sensory App House"><!--SAH-COPYRIGHT © 2026 Sensory App House. All rights reserved.--><metadata id="sah-copyright"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#"><cc:Work rdf:about=""><dc:rights><cc:Agent><dc:title>© 2026 Sensory App House. All rights reserved.</dc:title></cc:Agent></dc:rights><dc:creator><cc:Agent><dc:title>Sensory App House (PiCom)</dc:title></cc:Agent></dc:creator><dc:date>2026</dc:date></cc:Work></rdf:RDF></metadata>
  <!-- Anime angle: bold cel-shaded rays with sparkles and speed lines -->
  <defs>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#4a4a5a"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5577"/>
      <stop offset="100%" stop-color="#cc2244"/>
    </linearGradient>
  </defs>
  <!-- Off-white background -->
  <rect width="512" height="512" fill="#f8f6f0"/>
  <!-- Subtle speed lines -->
  <line x1="60" y1="60" x2="120" y2="80" stroke="#cccccc" stroke-width="2"/>
  <line x1="440" y1="80" x2="500" y2="60" stroke="#cccccc" stroke-width="2"/>
  <line x1="60" y1="450" x2="120" y2="440" stroke="#cccccc" stroke-width="2"/>
  <!-- Horizontal ray -->
  <line x1="96" y1="384" x2="460" y2="384" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Upper-right ray (45°) -->
  <line x1="96" y1="384" x2="353" y2="127" stroke="url(#rayGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Bold black outline overlay for cel-shading effect -->
  <line x1="96" y1="384" x2="460" y2="384" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="384" x2="353" y2="127" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Red arc indicating the angle -->
  <path d="M 196 384 A 100 100 0 0 0 166.7 313.3" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 196 384 A 100 100 0 0 0 166.7 313.3" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- Vertex dot -->
  <circle cx="96" cy="384" r="14" fill="#1a1a1a"/>
  <circle cx="92" cy="380" r="4" fill="#ffffff"/>
  <!-- Anime sparkles -->
  <path d="M 380 180 L 388 200 L 408 208 L 388 216 L 380 236 L 372 216 L 352 208 L 372 200 Z" fill="#ffd700" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 420 280 L 425 290 L 435 295 L 425 300 L 420 310 L 415 300 L 405 295 L 415 290 Z" fill="#87ceeb" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 200 140 L 204 148 L 212 152 L 204 156 L 200 164 L 196 156 L 188 152 L 196 148 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
</svg>
